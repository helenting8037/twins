<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>猜猜誰是哥哥</title>
<style>
  /* 配色取自彌月小卡；背景圖 img/bg.jpg 是予涵提供的水彩紙 */
  :root { --bg:#fbf4e6; --ink:#5e4636; --soft:#715541; --accent:#9a7058; --ok:#6f9a76; --no:#c0817a; --line:#7155413d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; font-size:18px; display:flex; justify-content:center; }
  html { background:var(--bg); }
  /* iPhone Safari 會在狀態列和網址列塗上純色（=html 底色），所以背景上下緣淡出成同一個米色，接縫就看不出來 */
  body::before { content:""; position:fixed; left:0; right:0; top:0; height:100vh; height:100lvh; pointer-events:none;
    background:linear-gradient(var(--bg), #fbf4e600 120px, #fbf4e600 calc(100% - 160px), var(--bg)), url(img/bg.jpg) center / cover no-repeat; }
  main { position:relative; width:100%; max-width:440px; padding:calc(28px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); text-align:center; }
  h1 { font-size:28px; margin:6px 0 10px; color:var(--soft); }
  p { line-height:1.75; margin:8px 0; }
  .sub { color:var(--soft); font-size:17px; }
  .cover { margin:6px 0 14px; }
  /* 寫生照邊緣以橢圓淡出融進水彩背景 */
  .cover img { display:block; width:100%;
    -webkit-mask-image:radial-gradient(ellipse 50% 50% at center, #000 60%, transparent 100%);
    mask-image:radial-gradient(ellipse 50% 50% at center, #000 60%, transparent 100%); }
  .medal { display:block; width:130px; height:130px; margin:0 auto; }
  .pick .tag, .glabel .tag { display:inline; width:38px; height:38px; aspect-ratio:auto; vertical-align:-11px; margin-right:4px; }
  .hello { font-family:Georgia,"Times New Roman",serif; font-style:italic; color:#8e7a6c; font-size:20px; letter-spacing:.5px; margin:0 0 6px; }
  .btn { display:block; width:100%; border:0; border-radius:999px; padding:16px; font-size:19px; font-weight:600; background:var(--accent); color:var(--bg); margin-top:20px; cursor:pointer; box-shadow:0 3px 10px #7155412e; }
  .btn.ghost { background:#fffaf2b3; color:var(--soft); border:1px solid var(--line); box-shadow:none; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0 8px; }
  .pick { border:3px solid transparent; border-radius:18px; padding:0; background:#fffaf2cc; overflow:hidden; cursor:pointer; box-shadow:0 3px 14px #7155411f; font:inherit; color:inherit; }
  .pick img { display:block; width:100%; aspect-ratio:3/4; object-fit:cover; }
  .pick span { display:block; padding:8px; font-size:18px; min-height:42px; }
  .pair.wide { grid-template-columns:1fr; }
  .pair.wide .pick img { aspect-ratio:3/2; }
  .gphoto { position:relative; margin:18px 0 12px; border-radius:18px; overflow:hidden; box-shadow:0 3px 14px #7155411f; }
  .gphoto img { display:block; width:100%; }
  .glabel { position:absolute; bottom:10px; padding:2px 12px 2px 4px; border-radius:999px; background:#fffaf2e6; font-size:17px; }
  .glabel:empty { display:none; }
  .gl { left:10px; } .gr { right:10px; }
  .gbtns { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .gbtn { border:3px solid transparent; border-radius:999px; padding:14px 6px; font:inherit; font-size:18px; font-weight:600; background:#fffaf2cc; color:var(--soft); box-shadow:0 3px 14px #7155411f; cursor:pointer; }
  .gbtn.ok { border-color:var(--ok); } .gbtn.no { border-color:var(--no); }
  .pick.ok { border-color:var(--ok); } .pick.no { border-color:var(--no); }
  .fb { font-size:20px; font-weight:600; min-height:28px; }
  hr { border:0; border-top:1px dashed var(--line); margin:24px 0; }
  .hide { display:none; }
</style>
</head>
<body>
<main>

  <section id="start">
    <p class="hello">Welcome to the world</p>
    <figure class="cover"><img src="img/portrait.jpg" alt="Dylan 和 Orion 的新生兒寫生照"></figure>
    <h1>猜猜誰是哥哥？</h1>
    <p>我們家這次出貨是<b>「複製＋貼上」</b>規格，<br>同卵雙胞胎，原廠沒附說明書。</p>
    <p class="sub">連爸媽有時候都要多看兩眼才敢叫名字，<br>換你來挑戰！</p>
    <button class="btn" onclick="go(0)">我眼力很好，開始 💪</button>
  </section>

  <section id="quiz" class="hide">
    <p class="sub" id="step"></p>
    <h1>哪個是<span style="color:var(--accent)">哥哥</span>？</h1>
    <p class="sub" id="ask"></p>
    <div class="pair">
      <button class="pick" id="L" onclick="pick('L')"><img alt="左邊的寶寶"><span></span></button>
      <button class="pick" id="R" onclick="pick('R')"><img alt="右邊的寶寶"><span></span></button>
    </div>
    <div class="hide" id="group">
      <div class="gphoto"><img alt="雙寶合照"><span class="glabel gl" id="gl"></span><span class="glabel gr" id="gr"></span></div>
      <div class="gbtns">
        <button class="gbtn" id="GL" onclick="pick('L')">👈 左邊是哥哥</button>
        <button class="gbtn" id="GR" onclick="pick('R')">右邊是哥哥 👉</button>
      </div>
    </div>
    <p class="fb" id="fb"></p>
    <p class="sub" id="hint"></p>
    <button class="btn hide" id="next" onclick="go(i + 1)">下一題 →</button>
  </section>

  <section id="end" class="hide">
    <img class="medal" id="medal" alt="">
    <p class="sub" id="score"></p>
    <h1 id="rank"></h1>
    <p id="comment"></p>
    <p class="sub">🔎 破解祕笈：弟弟臉頰肉比哥哥多；<br>弟弟有兩個髮旋，哥哥只有一個髮旋</p>
    <hr>
    <p>謝謝你來分享我們的喜悅 🎉<br>雙寶滿月了，請繼續幫我們一起分辨（誤）</p>
    <p class="sub">峻泓・予涵 敬上</p>
    <button class="btn ghost" onclick="score = 0; go(0)">不服，再玩一次</button>
  </section>

</main>
<script>
  // ===== 予涵只要改這一區 =====
  // 每題一張哥哥、一張弟弟；每次玩左右位置隨機。hint 是答完才出現的小提示，不想給就留空。
  // 橫向照片加 wide: true，會改成上下排列、不裁切。
  // 合照題用 group（一張照片），由大家選左邊或右邊；位置固定不隨機。
  // 只要玩一題（A 玩法）就只留第一行。
  const ROUNDS = [
    { gege: 'img/1R-v4.jpg', didi: 'img/1L-v4.jpg', hint: '' },
    { gege: 'img/2R-v4.jpg', didi: 'img/2L-v4.jpg', hint: '' },
    { gege: 'img/3R-v4.jpg', didi: 'img/3L-v4.jpg', hint: '', wide: true },  // 橫向照片：上下排
    { group: 'img/4-v4.jpg', gegeSide: 'L', hint: '' },  // 合照：gegeSide 填哥哥在照片的左（L）或右（R）
  ];

  const ASK = [
    '憑直覺！想太多會覺得兩個都像',
    '哥哥只早出來 1 分鐘，但大哥氣場已經上身（應該吧）',
    '偷偷給個線索：仔細看臉頰肉 👀',
    '放輕鬆，爸媽也常常要確認第二次',
  ];
  const RIGHT = [
    '答對！眼力好到可以來當鑑定師 🔍',
    '正確！雙寶表示：被認出來了 😳',
    '漂亮！你可以來幫忙換尿布了（誤）',
    '厲害！雙寶都想跟你擊掌了 🙌',
  ];
  const WRONG = [
    '猜錯～沒關係，他們自己照鏡子大概也分不出來',
    '選錯了～哥哥：我才是本人好嗎 😤',
    '錯啦～這位是弟弟，正在假扮哥哥中 🕵️',
    '哎呀～被雙寶的障眼法騙了 🙈',
  ];
  // ===== 改到這裡 =====

  const $ = id => document.getElementById(id);
  const used = new Set();  // 同一局不重複出現同一句
  const any = arr => {
    const left = arr.filter(x => !used.has(x));
    const x = left.length ? left[Math.floor(Math.random() * left.length)] : arr[0];
    used.add(x);
    return x;
  };
  const placeholder = side => 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect width="300" height="400" fill="#fde8d7"/><text x="150" y="190" font-size="80" text-anchor="middle">👶</text><text x="150" y="260" font-size="22" fill="#8a7768" text-anchor="middle">照片待放（${side}）</text></svg>`);
  for (const n of ['crown', 'bottle', 'trophy', 'silver', 'clover', 'coin']) new Image().src = `img/icons/${n}.png`;
  let i = 0, score = 0, done = false;

  function show(id) {
    for (const s of ['start', 'quiz', 'end']) $(s).classList.toggle('hide', s !== id);
    scrollTo(0, 0);
  }

  function go(n) {
    i = n;
    if (n === 0) used.clear();
    if (i >= ROUNDS.length) return finish();
    done = false;
    const r = ROUNDS[i];
    r.side = r.group ? r.gegeSide : Math.random() < 0.5 ? 'L' : 'R';  // 哥哥這次在哪邊
    document.querySelector('.pair').classList.toggle('wide', !!r.wide);
    document.querySelector('.pair').classList.toggle('hide', !!r.group);
    $('group').classList.toggle('hide', !r.group);
    $('step').textContent = `第 ${i + 1} / ${ROUNDS.length} 題`;
    $('ask').textContent = r.group ? '壓軸題！合照裡哪邊是哥哥？' : any(ASK);
    if (r.group) {
      $('group').querySelector('img').src = r.group;
      $('gl').innerHTML = $('gr').innerHTML = '';
      $('GL').className = $('GR').className = 'gbtn';
    }
    else for (const s of ['L', 'R']) {
      const img = $(s).querySelector('img');
      img.onerror = () => { img.onerror = null; img.src = placeholder(s === 'L' ? '左' : '右'); };
      img.src = s === r.side ? r.gege : r.didi;
      $(s).className = 'pick';
      $(s).querySelector('span').textContent = '';
    }
    $('fb').textContent = $('hint').textContent = '';
    $('next').classList.add('hide');
    show('quiz');
  }

  function pick(side) {
    if (done) return;
    done = true;
    const r = ROUNDS[i], right = side === r.side;
    if (right) score++;
    for (const s of ['L', 'R']) {
      const label = s === r.side
        ? '<img class="tag" src="img/icons/crown.png" alt="">哥哥'
        : '<img class="tag" src="img/icons/bottle.png" alt="">弟弟';
      if (r.group) $(s === 'L' ? 'gl' : 'gr').innerHTML = label;  // 合照：標籤貼在照片左下／右下
      else $(s).querySelector('span').innerHTML = label;
      if (s === side) $(r.group ? 'G' + s : s).classList.add(right ? 'ok' : 'no');
    }
    $('fb').textContent = any(right ? RIGHT : WRONG);
    $('fb').style.color = right ? 'var(--ok)' : 'var(--no)';
    $('hint').textContent = r.hint ? '🔎 ' + r.hint : '';
    $('next').textContent = i + 1 < ROUNDS.length ? '下一題 →' : '看我的成績 →';
    $('next').classList.remove('hide');
    // 上下排時按鈕可能在畫面外：等點擊手勢結束後，捲到按鈕底部露出（innerHeight 在 iPhone 會扣掉網址列）
    setTimeout(() => {
      const y = $('next').getBoundingClientRect().bottom + scrollY - innerHeight + 24;
      if (y > scrollY) scrollTo(0, y);  // 直接跳，不用平滑捲動（有些瀏覽器平滑捲動會卡住）
    }, 150);
  }

  function finish() {
    const n = ROUNDS.length;
    const [medal, rank, comment] =
      score === n ? ['trophy', '雙寶認證・特級保母', '全對！你可以直接來我們家上班了（薪水是寶寶的笑容）'] :
      score / n >= 0.6 ? ['silver', '合格親友・可以抱', '眼力不錯，下次見面直接叫名字，應該不會被抓包'] :
      score > 0 ? ['clover', '運氣型選手', '建議見面時先數髮旋再開口'] :
      ['coin', '全錯也是一種天分', '丟硬幣都比較準，你到底是怎麼辦到的？'];
    $('medal').src = `img/icons/${medal}.png`;
    $('score').textContent = `答對 ${score} / ${n} 題`;
    $('rank').textContent = rank;
    $('comment').textContent = comment;
    show('end');
  }
</script>
</body>
</html>
